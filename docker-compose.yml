version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: deltateam_db
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - deltateam_network

  # WordPress
  wordpress:
    image: wordpress:latest
    container_name: deltateam_wordpress
    restart: always
    depends_on:
      - db
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./deltateam-theme:/var/www/html/wp-content/themes/deltateam-theme
    networks:
      - deltateam_network

  # phpMyAdmin (optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: deltateam_phpmyadmin
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - deltateam_network

volumes:
  db_data:
  wordpress_data:

networks:
  deltateam_network:
    driver: bridge
